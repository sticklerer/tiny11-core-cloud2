name: Build Tiny11 Core ISO (Cloud)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          wimtools \
          grub-pc-bin \
          grub-common \
          xorriso \
          wget \
          rsync
          - name: Download UUP Dump script
  run: |
    git clone https://github.com/uup-dump/uup-dump-linux.git uup

- name: Build Windows 11 ISO from UUP (24H2)
  run: |
    cd uup
    ./uup_download_linux.sh \
      26100 \
      amd64 \
      en-us \
      Professional \
      iso


    - name: Extract ISO
      run: |
        mkdir iso mount
        sudo mount -o loop win11.iso mount
        rsync -a mount/ iso/
        sudo umount mount

    - name: Extract install.wim
      run: |
        mkdir wim
        wimlib-imagex extract iso/sources/install.wim 1 --dest-dir=wim

    - name: Core stripping (minimal)
      run: |
        rm -rf wim/Program\ Files*
        rm -rf wim/Windows/SystemApps
        rm -rf wim/Windows/Media
        rm -rf wim/Windows/Web
        rm -rf wim/Windows/WinSxS/Backup

    - name: Rebuild install.wim
      run: |
        mv iso/sources/install.wim iso/sources/install.wim.bak
        wimlib-imagex capture wim iso/sources/install.wim --compress=recovery

    - name: Create ISO
      run: |
        grub-mkrescue -o tiny11-core.iso iso

    - name: Upload ISO
      uses: actions/upload-artifact@v4
      with:
        name: tiny11-core-iso
        path: tiny11-core.iso
